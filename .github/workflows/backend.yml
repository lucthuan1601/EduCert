name: Backend and contract checks

on:
  push:
    branches: [main, 'feature/BE-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix backend run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: educert-backend-verification
          path: backend/reports/
